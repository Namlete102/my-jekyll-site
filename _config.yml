title: jekyll-latex
description: Write markdown posts with LaTeX typography

# QUAN TRỌNG: đặt đúng tên repo của bạn
baseurl: "/my-jekyll-site"      # ← tên repo GitHub của bạn
url: "https://github.com/Namlete102/my-jekyll-site" # ← tên repo GitHub của bạn

markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM

plugins:
  - jekyll-toc

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"